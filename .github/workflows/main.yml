# .github/workflows/upload-ram-files.yml
name: Download & Upload RAM Contents

# 手動トリガー＆毎日 0:00 実行（不要なら workflow_dispatch のみでOK）
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-ram:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 必要なツールをインストール（zip 展開用）
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      # 3. RAM ファイルをダウンロード
      - name: Download RAM file
        run: |
          wget -O downloaded.ram "https://example.com/path/to/your.ram"
          # ↓もし .zip なら downloaded.zip、.tar.gz なら downloaded.tar.gz にリネームしてもOK

      # 4. RAM ファイルを展開
      - name: Extract RAM contents
        run: |
          mkdir -p ram_contents
          # .ram が zip フォーマットの場合
          unzip downloaded.ram -d ram_contents
          # もし tar.gz なら以下を使う：
          # tar zxvf downloaded.ram -C ram_contents

      # 5. 展開したファイルをリポジトリ直下へコピー
      - name: Copy extracted files into repo
        run: |
          cp -r ram_contents/* .

      # 6. 変更をコミットしてプッシュ
      - name: Commit & Push changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: update RAM file contents"
          push: true
