# .github/workflows/upload-ram-files.yml
name: Download & Upload RAM Contents

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'ダウンロードする RAM ファイルの URL'
        required: true
        default: 'https://example.com/path/to/file.ram'

jobs:
  update-ram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip tar

      - name: Download RAM file
        run: |
          URL="${{ github.event.inputs.download_url }}"
          FILENAME=$(basename "$URL")
          wget -O "$FILENAME" "$URL"

      - name: Extract or Move
        run: |
          FILENAME=$(basename "${{ github.event.inputs.download_url }}")
          mkdir -p ram_contents
          case "$FILENAME" in
            *.zip)
              unzip "$FILENAME" -d ram_contents
              ;;
            *.tar.gz|*.tgz)
              tar zxvf "$FILENAME" -C ram_contents
              ;;
            *.tar)
              tar xvf "$FILENAME" -C ram_contents
              ;;
            *)
              # 圧縮ファイルでなければそのまま格納
              mv "$FILENAME" ram_contents/
              ;;
          esac

      - name: Copy extracted files into repo
        run: |
          cp -r ram_contents/* .

      - name: Commit & Push changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: update RAM file contents from ${{ github.event.inputs.download_url }}"
          push: true
